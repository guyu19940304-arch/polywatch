name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build Linux amd64 image
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag polywatch-ci .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' polywatch-ci)" = "linux/amd64"
      - name: Smoke test container and SQLite
        run: |
          trap 'docker logs polywatch-smoke; docker rm -fv polywatch-smoke' EXIT
          docker run -d --name polywatch-smoke --read-only \
            --tmpfs /tmp:size=32m --tmpfs /data:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e MONITOR_ENABLED=false -p 127.0.0.1:18787:8787 polywatch-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/api/health > /tmp/polywatch-health.json; then break; fi
            sleep 1
          done
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/polywatch-health.json')); if(h.status!=='ok') process.exit(1)"
          curl --fail --silent http://127.0.0.1:18787/ | grep -q '<div id="root">'
          docker exec polywatch-smoke node --input-type=module -e "import {createStore} from './server/store.mjs'; const s=createStore({path:'/data/smoke.sqlite'}); s.close();"
          docker exec polywatch-smoke node server/store.mjs compact /data/smoke.sqlite /data/smoke-compact.sqlite
      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag polywatch-ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAG=latest
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            exit 0
          fi
          docker tag polywatch-ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker logout ghcr.io
